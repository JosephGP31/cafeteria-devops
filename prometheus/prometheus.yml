global:
  # 1. Define cada cuanto tiempo Prometheus recoge metricas (ej. 15s)
  scrape_interval: 15s

scrape_configs:
  - job_name: "cafeteria-api"
    metrics_path: "/metrics"
    static_configs:
      # 2. Escribe el nombre del servicio y puerto interno de FastAPI: ["api:8000"]
      - targets: ["api:8000"]