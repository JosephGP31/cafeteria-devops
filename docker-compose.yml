services:
  db:
    image: postgres:16-alpine
    container_name: cafeteria_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cafeteria_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:  .
    container_name: cafeteria_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST:  db
  
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cafeteria_net

  nginx:
    image: nginx:alpine
    container_name: cafeteria_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - cafeteria_net

volumes:
  postgres_data:

networks:
  cafeteria_net:
    driver: bridge