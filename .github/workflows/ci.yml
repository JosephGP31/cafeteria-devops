name: CI Cafeteria Aroma

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install ruff

      - name: Revisar errores y estilo con ruff
        run: |
          # 1. Revisa errores y malas practicas con: ruff check .
          # Completa aquí
          # 2. Verifica el formato sin modificar archivos con: ruff format --check .
          # Completa aquí
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          # 1. Escribe la contrasena falsa de pruebas: test_pass
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: cafeteria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: cafeteria_test
      # 2. Como el puerto 5432 esta expuesto en la misma maquina del runner, escribe: localhost
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas con pytest
        # 3. Escribe el comando: python -m pytest -v
        run: python -m pytest -v